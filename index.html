<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEPA Scan for Revolut</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icon-192.jpg" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #f3f6f8;
      --card: #ffffff;
      --card-2: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #dbe3ea;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --ok: #166534;
      --ok-bg: #ecfdf5;
      --ok-border: #bbf7d0;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #eef5f7 0%, #f8fbfc 100%);
      padding: 16px;
      line-height: 1.45;
    }
    .app {
      max-width: 1100px;
      margin: 0 auto;
    }
    .hero { margin-bottom: 16px; }
    .hero h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.15; }
    .hero p { margin: 0; color: var(--muted); line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 20px; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    button, .file-label {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      cursor: pointer;
      background: #e8eef2;
      color: var(--text);
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { background: #fee2e2; color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="file"] { display: none; }
    video {
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      display: block;
    }
    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }
    .status.ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
    .status.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
    .status.err { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .field {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 78px;
    }
    .field-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field-value {
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }
    .mono { font-family: Consolas, Monaco, monospace; }
    #qrContainer {
      display: grid;
      place-items: center;
      min-height: 260px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: #fff;
      padding: 12px;
      text-align: center;
    }
    .note { margin-top: 12px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .metadata {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #475569;
    }
    @media (min-width: 860px) {
      .grid { grid-template-columns: 1.05fr 0.95fr; }
      .result-grid { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>SEPA Scan for Revolut</h1>
      <p>Skeniraj HUB3 barkod s računa i generiraj EPC QR za brzo plaćanje u Revolutu.</p>
    </section>
    <div class="grid">
      <!-- ULaz -->
      <section class="card">
        <h2>Ulaz</h2>
        <label for="fileInput" class="file-label">Odaberi sliku ili PDF</label>
        <input type="file" id="fileInput" accept="image/*,.pdf,application/pdf" />
        <div class="actions">
          <button id="startCameraBtn" class="primary" type="button">Pokreni kameru</button>
          <button id="stopCameraBtn" class="danger" type="button" disabled>Zaustavi kameru</button>
          <button id="rescanBtn" type="button">Novo skeniranje</button>
        </div>
        <div class="media-wrap" style="margin-top:12px;">
          <video id="video" autoplay muted playsinline></video>
        </div>
        <div id="statusBox" class="status" role="status" aria-live="polite">
          Čekam skeniranje...
        </div>
      </section>
      <!-- SEPA QR -->
      <section class="card">
        <h2>SEPA QR</h2>
        <div id="qrContainer">
          <span class="note">QR će se pojaviti nakon uspješnog parsiranja.</span>
        </div>
        <div class="actions">
          <button id="copyIbanBtn" type="button" disabled>Kopiraj IBAN</button>
          <button id="copyRefBtn" type="button" disabled>Kopiraj model + poziv</button>
          <button id="shareQrBtn" type="button" disabled>Spremi ili podijeli QR</button>
          <button id="saveQrBtn" type="button" disabled>Preuzmi QR (PNG)</button>
          <button id="openRevolutBtn" class="primary" type="button">Otvori Revolut</button>
        </div>
      </section>
    </div>
    <!-- Očitani podaci -->
    <section class="card" style="margin-top:16px;">
      <h2>Očitani podaci</h2>
      <!-- Metadata skeniranja -->
      <div class="metadata" style="margin-bottom:12px;">
        <strong>Detalji skeniranja:</strong> 
        <span id="scanMeta">—</span>
      </div>
      <div class="result-grid">
        <div class="field">
          <span class="field-label">Platitelj</span>
          <div id="payerField" class="field-value">—</div>
        </div>
        <div class="field">
          <span class="field-label">Primatelj</span>
          <div id="recipientField" class="field-value">—</div>
        </div>
        <div class="field">
          <span class="field-label">IBAN</span>
          <div id="ibanField" class="field-value mono">—</div>
        </div>
        <div class="field">
          <span class="field-label">Model + poziv</span>
          <div id="refField" class="field-value mono">—</div>
        </div>
        <div class="field">
          <span class="field-label">Iznos</span>
          <div id="amountField" class="field-value mono">—</div>
        </div>
        <div class="field">
          <span class="field-label">Opis plaćanja</span>
          <div id="descField" class="field-value">—</div>
        </div>
      </div>
      <div id="warningsBox" class="status hidden" role="alert"></div>
      <div id="rawBox" class="status hidden"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
